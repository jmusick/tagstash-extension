<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagstash Sidebar</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="edit-modal.css">
  <script src="lib/theme.js"></script>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <a href="https://tagsta.sh/" target="_blank" rel="noopener noreferrer" class="sidebar-title-link"><h1 class="brand-lockup"><img src="icons/icon-48.png" width="28" height="28" alt=""><span>Tagstash</span></h1></a>
      <div class="sort-toggle" id="sort-toggle" title="Sort tags">
        <button class="sort-btn active" data-sort="count">Count</button>
        <button class="sort-btn" data-sort="alpha">A–Z</button>
      </div>
      <button id="refresh-btn" class="refresh-btn" title="Refresh">↻</button>
      <button id="prefs-btn" class="prefs-btn" type="button" title="Preferences" aria-label="Preferences" aria-expanded="false" aria-controls="prefs-panel">⚙</button>
    </div>
    <div id="prefs-panel" class="prefs-panel" hidden>
      <fieldset class="prefs-group">
        <legend>Open bookmarks in</legend>
        <label class="prefs-choice">
          <input type="radio" name="openLinksTarget" value="current" />
          <span>The current tab</span>
        </label>
        <label class="prefs-choice">
          <input type="radio" name="openLinksTarget" value="new" />
          <span>A new tab</span>
        </label>
      </fieldset>
      <p class="prefs-note">Saved in this browser. The Tagstash website has its own separate setting.</p>
    </div>
    <div id="sidebar-search" class="sidebar-search">
      <input id="search-input" type="text" placeholder="Search bookmarks" autocomplete="off" />
      <button id="search-clear" class="search-clear-btn" type="button" title="Clear search" hidden>✕</button>
    </div>
    <p id="not-logged-in" hidden>
      Please sign in via the Tagstash toolbar button first.
    </p>
    <ul id="tags-list"></ul>
    <footer class="sidebar-footer"><span class="version-label" data-version></span></footer>
  </div>

  <script src="sidebar.js" type="module"></script>
</body>
</html>
